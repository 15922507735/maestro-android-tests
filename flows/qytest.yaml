# 向上滑动屏幕
- swipe:
    start: 50%, 70% # 起点：屏幕宽度50%，高度70%
    end: 50%, 30% # 终点：屏幕宽度50%，高度30%
    duration: 500 # 滑动持续时间（毫秒），数值越大越慢
# 点击资讯-查看详情
- tapOn:
    point: 3%,38%
# 点击收藏
